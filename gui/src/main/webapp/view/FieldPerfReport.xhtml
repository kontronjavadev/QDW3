<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	template="/templates/ui.xhtml">

<f:metadata>
	<f:viewAction action="#{fieldPerfReport.initView()}"/>
</f:metadata>

<ui:define name="title">#{fieldPerfReport.formTitle}</ui:define>

<ui:define name="content">
	<h:panelGrid columns="3">
		<div class="pi pi-list" style="font-size: 2em"/>
		<h:outputText id="lblFormTitle" value="&#160;#{fieldPerfReport.formTitle}" styleClass="label-form-title"/>
		<p:ajaxStatus style="width:16px;height:16px;">
			<f:facet name="start">
				<h:graphicImage value="/images/ajaxloading.gif"/>
			</f:facet>

			<f:facet name="complete">
				<h:outputText value=""/>
			</f:facet>
		</p:ajaxStatus>
	</h:panelGrid>

	<p:growl id="growl" showDetail="true" skipDetailIfEqualsSummary="true" keepAlive="true" life="10000" />

	<p:dialog height="auto" width="1000" header="#{i18n.search_input_dlg}" widgetVar="dlgSearchInput" id="dlgSearchInput" closeOnEscape="true" modal="true">
		<p:tabView id="tabViewSearchInput" dynamic="false">
			<p:tab title="#{i18n.search_input_saved_query_title}">
				<h:panelGrid columns="1">
					<h:outputLabel styleClass="label-field-mandatory" value="#{i18n.search_input_lbl_saved_query}"/>
					<p:selectOneListbox id="savedQueryList" value="#{fieldPerfReport.selectedSavedQuery}" style="#{sizeServiceBean.searchQueriesHeight()}; width:946px" styleClass="flex-listbox" >
						<f:selectItems value="#{fieldPerfReport.savedQueries}"/>
					</p:selectOneListbox>
					<h:panelGrid columns="3">
						<p:commandButton icon="pi pi-caret-right" value="#{i18n.search_input_run_saved_query}" action="#{fieldPerfReport.runSavedQuery}" ajax="false"/>
						<p:commandButton icon="pi pi-pencil" value="#{i18n.search_input_rename_saved_query}" actionListener="#{fieldPerfReport.openRenameDialog}" ajax="true"/>
						<p:commandButton icon="pi pi-eraser" value="#{i18n.search_input_delete_saved_query}" actionListener="#{fieldPerfReport.deleteSavedQuery}" update="savedQueryList" ajax="true"/>
					</h:panelGrid>
				</h:panelGrid>
			</p:tab>
		</p:tabView>

		<h:panelGrid columns="2">
			<p:commandButton id="cmdSearch" value="#{i18n.search_input_perform_search}" action="#{fieldPerfReport.fetchMaterials}" ajax="false"/>
			<p:commandButton id="cmdClear" value="#{i18n.command_clear}" action="#{fieldPerfReport.clearSearchObject}" update="tabViewSearchInput" ajax="true"/>
		</h:panelGrid>
	</p:dialog>

<!-- Query rename dialog -->
	<p:dialog widgetVar="dlgQeryRename" id="dlgQeryRename" modal="true" showEffect="fade" hideEffect="fade" focus="txtNewQueryName" closeOnEscape="true">
		<f:facet name="header">
			<i class="pi pi-pencil"/>
			<h:outputText value="&#160;#{i18n.query_rename_title}"/>
		</f:facet>

		<h:panelGrid columns="3">
			<h:outputLabel value="#{i18n.query_rename_newname} *:" for="txtNewQueryName" styleClass="label-field-mandatory"/>
			<p:inputText id="txtNewQueryName" value="#{fieldPerfReport.newQueryName}"/>
			<p:tooltip for="txtNewQueryName" value=""/>
		</h:panelGrid>
		<p/>

		<f:facet name="footer">
			<p:commandButton id="cmdRename" icon="pi pi-save" value="#{i18n.command_rename}" ajax="true" 
				actionListener="#{fieldPerfReport.renameQuery()}"
				update="tabViewSearchInput,growl" oncomplete="PF('dlgQeryRename').hide()"/>

			<p:commandButton id="cmdCancel" icon="pi pi-times" value="#{i18n.command_cancel}" onclick="PF('dlgQeryRename').hide()" />

			<p:defaultCommand target="cmdRename" scope="dlgQeryRename"/>
		</f:facet>
	</p:dialog>



	<p:menubar>
		<p:submenu icon="pi pi-file" label="#{i18n.mnu_file}" id="panData_mniFile">
			<p:menuitem value="#{i18n.search_input_dlg_save_query}" icon="pi pi-save" onclick="PF('dlgSaveQuery').show()"/>
		</p:submenu>
		<p:submenu icon="pi pi-print" label="#{i18n.mnu_export}">
			<p:menuitem value="#{i18n.action_export_xls}" ajax="false" icon="pi pi-file-excel">
				<p:dataExporter type="xlsxstream" target="panData" fileName="MaterialList"/>
			</p:menuitem>
			<p:menuitem value="#{i18n.action_export_pdf}" ajax="false" icon="pi pi-file-pdf">
				<p:dataExporter type="pdf" target="panData" fileName="MaterialList"/>
			</p:menuitem>
		</p:submenu>
		<p:menuitem value="#{i18n.action_search_input}" ajax="true" icon="pi pi-search" id="panData_mniSearch" onclick="PF('dlgSearchInput').show()"/>
	</p:menubar>





	<!-- Das RemoteCommand für die Bulk-Validierung aus JavaScript -->
	<p:remoteCommand name="processPastedMaterials"
		action="#{fieldPerfReport.handlePastedMaterials}"
		process="@this"
		update="fi_matnr growl" />

	<p:tabView id="tabview1" dynamic="true" effect="fade" effectDuration="fast" style="flex: 0 0 auto;">
		<p:tab id="tabPanBasic" title="#{i18n.fieldperfreportview_pan_basic}">
			<div class="ui-fluid custom-form-grid">
				<!-- Zeile 1: Label + Autocomplete (styleClass="span-3-cols") -->
				<h:outputLabel styleClass="label-field-optional" for="fi_matnr" value="#{i18n.col_fieldperfreportview_materialnumber}" />
				<p:autoComplete id="fi_matnr" styleClass="span-3-cols" multiple="true" forceSelection="true" 
					minQueryLength="2" maxResults="20" 
					value="#{fieldPerfReport.matNrs}" completeMethod="#{fieldPerfReport.onCompleteMaterialNumber}">
					<p:ajax event="change" process="@this" />
					<p:ajax event="itemSelect" process="@this" />
					<p:ajax event="itemUnselect" process="@this" />
				</p:autoComplete>



				<!-- Zeile 2 mit 2 Spalten: 4 Elemente (Label, Menu, Label, Menu) 
					Das zweite Label erhält jeweils zusätzlich die styleClass "block-separator", um den Abstand zu vergrößern -->
				<h:outputLabel styleClass="label-field-optional" for="fi_matnrset" value="#{i18n.col_fieldperfreportview_matnrset}" />
				<p:selectOneMenu id="fi_matnrset" converter="#{materialNumberSetDTOConverter}" 
					scrollHeight="350" value="#{fieldPerfReport.selectedMatNrSet}">
					<p:ajax process="@this" />
					<f:selectItem itemLabel="" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{fieldPerfReport.matNrSets}" var="matNrSetItem" 
						itemLabel="#{matNrSetItem.label}" itemValue="#{matNrSetItem}" />
				</p:selectOneMenu>

				<h:outputLabel styleClass="label-field-optional block-separator" for="fi_sernrset" value="#{i18n.col_fieldperfreportview_sernrset}" />
				<p:selectOneMenu id="fi_sernrset" converter="#{serialNumberSetDTOConverter}" 
					scrollHeight="350" value="#{fieldPerfReport.selectedSerNrSet}">
					<p:ajax process="@this" />
					<f:selectItem itemLabel="" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{fieldPerfReport.serNrSets}" var="serNrSetItem" 
						itemLabel="#{serNrSetItem.code}" itemValue="#{serNrSetItem}" />
				</p:selectOneMenu>



				<!-- Zeile mit 2 Spalten: 4 Elemente (Label, Autocomplete, Label, Autocomplete) -->
				<h:outputLabel styleClass="label-field-optional" for="fi_cust" value="#{i18n.col_fieldperfreportview_cust}" />
				<p:autoComplete id="fi_cust" multiple="true" forceSelection="true" 
					minQueryLength="2" maxResults="50" scrollHeight="350"
					value="#{fieldPerfReport.customers}" completeMethod="#{fieldPerfReport.onCompleteCustomer}"
					var="cust" itemLabel="#{cust.code}" itemValue="#{cust}" 
					converter="#{customerDTOConverter}" >

					<!-- Spaltendefinition für das Dropdown -->
					<p:column headerText="Name">
						<h:outputText value="#{fieldPerfReport.highlightMatchCust(cust.name)}" escape="false" />
					</p:column>

					<p:column headerText="Adresse">
						<h:outputText value="#{cust.street}, " />
						<h:outputText value="#{cust.zipCode} " />
						<h:outputText value="#{fieldPerfReport.highlightMatchCust(cust.city)} " escape="false" />
						<h:outputText value="(#{fieldPerfReport.highlightMatchCust(cust.country.name)})" escape="false" />
					</p:column>

					<p:ajax event="change" process="@this" />
					<p:ajax event="itemSelect" listener="#{fieldPerfReport.onCustomerSelect}" process="@this" />
					<p:ajax event="itemUnselect" process="@this" />
				</p:autoComplete>

				<h:outputLabel styleClass="label-field-optional block-separator" for="fi_supp" value="#{i18n.col_fieldperfreportview_supp}" />
				<p:autoComplete id="fi_supp" multiple="true" forceSelection="true" 
					minQueryLength="2" maxResults="50" scrollHeight="350"
					value="#{fieldPerfReport.supplier}" completeMethod="#{fieldPerfReport.onCompleteSupplier}"
					var="supp" itemLabel="#{supp.code}" itemValue="#{supp}" 
					converter="#{supplierDTOConverter}" >

					<!-- Spaltendefinition für das Dropdown -->
					<p:column headerText="Name">
						<h:outputText value="#{fieldPerfReport.highlightMatchSupp(supp.name)}" escape="false" />
					</p:column>

					<p:column headerText="Adresse">
						<h:outputText value="#{supp.street}, " />
						<h:outputText value="#{supp.zipCode} " />
						<h:outputText value="#{fieldPerfReport.highlightMatchSupp(supp.city)} " escape="false" />
						<h:outputText value="(#{fieldPerfReport.highlightMatchSupp(supp.country.name)})" escape="false" />
					</p:column>

					<p:ajax event="change" process="@this" />
					<p:ajax event="itemSelect" listener="#{fieldPerfReport.onSupplierSelect}" process="@this" />
					<p:ajax event="itemUnselect" process="@this" />
				</p:autoComplete>



				<!-- Zeile mit 2 Spalten: 4 Elemente (Label, CheckboxMenu, Label, CheckboxMenu) -->
				<h:outputLabel styleClass="label-field-optional" for="fi_mattype" value="#{i18n.col_fieldperfreportview_mattype}" />
				<p:selectCheckboxMenu id="fi_mattype" 
					updateLabel="true" scrollHeight="350"
					value="#{fieldPerfReport.selectedMatTypes}">
					<p:ajax process="@this" />
					<f:selectItems value="#{fieldPerfReport.matTypes}" />
				</p:selectCheckboxMenu>

				<h:outputLabel styleClass="label-field-optional block-separator" for="fi_matclass" value="#{i18n.col_fieldperfreportview_matclass}" />
				<p:selectCheckboxMenu id="fi_matclass" 
					updateLabel="true" scrollHeight="350"
					value="#{fieldPerfReport.selectedMatClasses}">
					<p:ajax process="@this" />
					<f:selectItems value="#{fieldPerfReport.matClasses}" />
				</p:selectCheckboxMenu>



				<!-- Zeile mit 2 Spalten: 4 Elemente (Label, CheckboxMenu, Label, CheckboxMenu) -->
				<h:outputLabel styleClass="label-field-optional" for="fi_analintv" value="#{i18n.col_fieldperfreportview_analintv}" />
				<p:selectOneMenu id="fi_analintv" 
					scrollHeight="350" value="#{fieldPerfReport.selectedAnalInterval}">
					<p:ajax process="@this" />
					<f:selectItem itemLabel="" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{fieldPerfReport.analIntervals}" 
						var="m" 
						itemValue="#{m}" 
						itemLabel="#{m} #{i18n.fieldperfreportview_monthmenu_months}" />
				</p:selectOneMenu>

				<h:outputLabel styleClass="label-field-optional block-separator" for="fi_retintv" value="#{i18n.col_fieldperfreportview_retintv}" />
				<p:selectOneMenu id="fi_retintv" 
					scrollHeight="350" value="#{fieldPerfReport.selectedReturnInterval}">
					<p:ajax process="@this" />
					<f:selectItem itemLabel="" itemValue="#{null}" noSelectionOption="true" />
					<f:selectItems value="#{fieldPerfReport.returnIntervals}" 
						var="m" 
						itemValue="#{m}" 
						itemLabel="#{m} #{i18n.fieldperfreportview_monthmenu_months}" />
				</p:selectOneMenu>



				<!-- Zeile mit 2 Spalten: 4 Elemente (Label, CheckboxMenu, Label, DatePicker) -->
				<h:outputLabel styleClass="label-field-optional" for="fi_rmatype" value="#{i18n.col_fieldperfreportview_rmatype}" />
				<p:selectCheckboxMenu id="fi_rmatype" 
					updateLabel="true" scrollHeight="350"
					value="#{fieldPerfReport.selectedRmaTypes}">
					<p:ajax process="@this" />
					<f:selectItems value="#{fieldPerfReport.rmaTypes}" />
				</p:selectCheckboxMenu>

				<h:outputLabel styleClass="label-field-optional block-separator" for="fi_start" value="#{i18n.col_fieldperfreportview_startdate}" />
				<p:datePicker id="fi_start" styleClass="fluid-date" 
					value="#{fieldPerfReport.startDate}" 
					pattern="#{userSession.dateFormat}" showButtonBar="true" showIcon="true" />
			</div>
		</p:tab>



		<p:tab id="tabPanAdvanced" title="#{i18n.fieldperfreportview_pan_advanced}">
		</p:tab>

	</p:tabView>








	<p/>

<!-- 
	<h:outputText styleClass="label-field-mandatory" value="#{i18n.result_total_number_records} #{fieldPerfReport.materialsList.size()}"/>
 -->

<script>
document.addEventListener("DOMContentLoaded", function() {
	// 1. Lokale Hilfsfunktion definieren
	function applyInitialTooltips(initialTooltips, fieldId) {
		// Falls kein JSON übergeben wurde (leeres Objekt), direkt abbrechen
		if (!initialTooltips || Object.keys(initialTooltips).length === 0) {
			return;
		}
        
		// Sucht alle Tokens für das exakt übergebene Feld
		document.querySelectorAll('[id$="' + fieldId + '"] .ui-autocomplete-token-label').forEach(function(span) {
			const code = span.textContent.trim();

		if (initialTooltips[code]) {
			const token = span.parentElement;
			token.classList.add('pf-tooltip-target');
			token.setAttribute('data-title', initialTooltips[code]);
		}
		});
	}

	// 2. Funktion für Customers aufrufen. 
	// JSF packt das JSON-Objekt beim Rendern direkt als ersten Parameter hinein.
	applyInitialTooltips(#{fieldPerfReport.preloadedCustomerTooltipsJson}, 'fi_cust');

	// 3. Funktion für Suppliers aufrufen
	applyInitialTooltips(#{fieldPerfReport.preloadedSupplierTooltipsJson}, 'fi_supp');
});
</script>

</ui:define>
</ui:composition>
