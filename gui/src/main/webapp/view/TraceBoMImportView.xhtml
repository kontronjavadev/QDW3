<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	template="/templates/ui.xhtml">

<f:metadata>
	<f:viewAction action="#{traceBoMImportView.initView()}"/>
</f:metadata>

<ui:define name="content">
	<p:growl id="growl" showDetail="true" skipDetailIfEqualsSummary="true" keepAlive="true" life="10000" />

	<h:panelGrid columns="3">
		<div class="pi pi-book" style="font-size: 2em"/>
		<h:outputText id="lblFormTitle" value="&#160;#{traceBoMImportView.formTitle}" styleClass="label-form-title"/>
		<p:ajaxStatus style="width:16px;height:16px;">
			<f:facet name="start">
				<h:graphicImage value="/images/ajaxloading.gif"/>
			</f:facet>

			<f:facet name="complete">
				<h:outputText value=""/>
			</f:facet>
		</p:ajaxStatus>
	</h:panelGrid>



<!-- TraceBoMImport view dialog -->

	<p:scrollPanel style="width:100%; height:calc(100vh - 141px);" mode="native">
		<h:outputLabel value="#{i18n.tracebomimportview_folderfilter}: " styleClass="label-field-otional"/>
		<p:selectCheckboxMenu id="multiple"
			label="#{i18n.filter_all_or_none_nofilter}"
			emptyLabel="#{i18n.filter_all_or_none_nofilter}"
			styleClass="filter-all-or-none"
			updateLabel="true" 
			scrollHeight="350"
			value="#{traceBoMImportView.selectedFolders}">
			<f:selectItems value="#{traceBoMImportView.folders}" />
		</p:selectCheckboxMenu>
	
		<table>
			<tr>
				<td><p:commandButton id="cmdImport" icon="pi pi-play" action="#{traceBoMImportView.runImport}" /></td>
				<td><h:outputLabel value="#{i18n.tracebomimportview_runimport}" for="cmdImport" styleClass="label-field-otional"/></td>
			</tr>

<!-- 
			<tr>
				<td><p:commandButton style="margin-left: 1rem" id="cmdImportFolder" icon="pi pi-play" action="#{traceBoMImportView.runImportFolder}" /></td>
				<td><h:outputLabel value="#{i18n.tracebomimportview_runimportfolder}" for="cmdImportFolder" styleClass="label-field-otional"/></td>
			</tr>
 -->



<!-- 
			<tr>
				<td><p:commandButton style="margin-left: 1.5rem" id="cmdXxx" icon="pi pi-play" action="#{traceBoMImportView.runXxx}" /></td>
				<td><h:outputLabel value="#{i18n.tracebomimportview_xxx}" for="cmdXxx" styleClass="label-field-otional"/></td>
			</tr>
 -->


		</table>
	</p:scrollPanel>


</ui:define>
</ui:composition>
