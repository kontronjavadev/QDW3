<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui"
	template="/templates/ui.xhtml">

<f:metadata>
	<f:viewAction action="#{compareTraceBoMDialog.initView()}"/>
	<f:viewParam name="selectedObjectId" value="#{compareTraceBoMDialog.selectedObjectId}"/>
</f:metadata>

<ui:define name="title">#{compareTraceBoMDialog.formTitle}</ui:define>

<ui:define name="content">
	<p:dialog header="#{i18n.feedback_dialog_header}" modal="true" widgetVar="msgBox" visible="#{(not empty facesContext.messageList)}">
		<p:messages id="messages" showDetail="true" showSummary="true"/>
	</p:dialog>

	<h:panelGrid columns="3">
		<div class="pi pi-arrow-right-arrow-left" style="font-size: 2em"/>
		<h:outputText id="lblFormTitle" value="&#160;#{compareTraceBoMDialog.formTitle}" styleClass="label-form-title"/>
		<p:ajaxStatus style="width:16px;height:16px;">
			<f:facet name="start">
				<h:graphicImage value="/images/ajaxloading.gif"/>
			</f:facet>

			<f:facet name="complete">
				<h:outputText value=""/>
			</f:facet>
		</p:ajaxStatus>
	</h:panelGrid>


	<p:panel>
		<h:panelGrid columns="6">
			<!-- als Link für Berechtigte und Text für Übrige -->
            <h:outputLabel value="#{i18n.lbl_compare_fst_serobj}:" rendered="#{userSession.checkAuthorizationString('ADMINISTRATOR;READONLY')}" for="cboFstSerObj" styleClass="label-field-optional"/>
            <p:commandLink rendered="#{userSession.checkAuthorizationString('ADMINISTRATOR;READONLY')}" id="cboFstSerObj" style="font-weight: bold;color: #0063ac" action="#{compareTraceBoMDialog.openViewTraceBoMDialog}">
                <f:setPropertyActionListener target="#{userSession.lastPage}" value="#{compareTraceBoMDialog.currentPageURL}"/>
                <h:outputText value="#{compareTraceBoMDialog.fstSerObj.toString()}"/>
            </p:commandLink>

            <h:outputLabel value="#{i18n.lbl_compare_fst_serobj}:" rendered="#{!userSession.checkAuthorizationString('ADMINISTRATOR;READONLY')}" for="cboFstSerObjAlt" styleClass="label-field-optional"/>
            <h:outputText styleClass="label-field-value" rendered="#{!userSession.checkAuthorizationString('ADMINISTRATOR;READONLY')}" id="cboFstSerObjAlt" value="#{compareTraceBoMDialog.fstSerObj.toString()}"/>
            <p:tooltip for="cboFstSerObj" value=""/>


			<h:outputLabel value="#{i18n.lbl_compare_snd_serobj}:" for="cboSndSerObj" styleClass="label-field-optional"/>
			<!-- onClick: Widget suchen und Suche ausführen (wenn mehr als 1 Zeichen eingegeben ist) 
			kein this.select(), um Text zu markieren, da das in diesem Fall die Handhabung erschwert -->
			<p:autoComplete styleClass="ui-wideautocomplete" id="cboSndSerObj" widgetVar="widvarSndSerObj" var="cboSndSerObjItem" itemValue="#{cboSndSerObjItem}" itemLabel="#{cboSndSerObjItem}" 
				value="#{compareTraceBoMDialog.sndSerObj}" onclick="if(PF('widvarSndSerObj').input.val().length > 1) {PF('widvarSndSerObj').search(PF('widvarSndSerObj').input.val())};" 
				converter="#{materialRevisionListDTOConverter}" scrollHeight="300" minQueryLength="1" forceSelection="true" completeMethod="#{compareTraceBoMDialog.onCompleteRevision}">
				<p:ajax event="itemSelect" listener="#{compareTraceBoMDialog.sndSerObjSelected}" update="tabview2"/>
			</p:autoComplete>
			<p:tooltip for="cboSndSerObj" value=""/>
		</h:panelGrid>
	</p:panel>

	<p/>


	<p:tabView id="tabview2" dynamic="true" effect="fade" effectDuration="fast" styleClass="tabViewForcompareViewPanel" >
		<p:tab id="tabPanBomItems" title="#{i18n.panel_comparetracebomdialog_panbomitems_title}">
			<ui:include src="panel/TraceBoMBoMComparePanel.xhtml"/>
		</p:tab>
	</p:tabView>



	<h:panelGrid columns="1" style="padding: unset; border: unset;">
		<p:commandButton id="cmdBack" icon="pi pi-caret-left" value="#{i18n.command_back}" action="#{userSession.getLastPage}" immediate="true" ajax="false"/>
	</h:panelGrid>

	<p:defaultCommand target=":form:cmdBack"/>

</ui:define>
</ui:composition>
