<ui:composition xmlns="https://jakarta.ee/xml/ns/jakartaee"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui">


	<p:menubar>
		<p:submenu icon="pi pi-refresh" label="#{i18n.mnu_view}">
			<p:menuitem value="#{i18n.action_refresh}" ajax="false" icon="pi pi-refresh" actionListener="#{controller.refresh}"/>
		</p:submenu>
		<p:submenu icon="pi pi-print" label="#{i18n.mnu_export}">
			<p:menuitem value="#{i18n.action_export_xls}" ajax="false" icon="pi pi-file-excel">
				<p:dataExporter type="xlsxstream" target="BoMTable" fileName="#{controller.defaultExcelExportFileName()}"/>
			</p:menuitem>
		</p:submenu>
	</p:menubar>


	<p:dataTable id="BoMTable" var="boMPanelItem" 
		selectionMode="single" selectionTextDisabled="false"
		selection="#{controller.selectedAssemblyCheckDto}"
		loadingMessage="#{i18n.action_fetch_data}"
		value="#{controller.assemblyCheckDtos}"
        scrollable="true" styleClass="compareViewPanelScrollable" allowUnsorting="true" 
		rowKey="#{boMPanelItem.materialId}" resizableColumns="true" resizeMode="expand"
	>
<!-- 
		<p:ajax event="rowDblselect" listener="#{controller.onBomItemsGridDoubleClick}"/>
 -->

		<p:column sortBy="#{boMPanelItem.materialNumber}" width="150" 
			exportValue="#{boMPanelItem.materialNumber}" class="tdnowrap" >
			<f:facet name="header">
				<h:outputText value="#{i18n.col_tracebomassemblypanel_materialnumber}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.materialNumber}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{boMPanelItem.materialShortText}" width="250" 
			exportValue="#{boMPanelItem.materialShortText}" class="tdnowrap" >
			<f:facet name="header">
				<h:outputText value="#{i18n.lbl_attr_material_shorttext}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.materialShortText}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{boMPanelItem.materialHierarchy}" width="150" 
			exportValue="#{boMPanelItem.materialHierarchy}" class="tdnowrap" >
			<f:facet name="header">
				<h:outputText value="#{i18n.lbl_attr_material_materialhierarchy}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.materialHierarchy}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{boMPanelItem.materialType}" width="80" 
			exportValue="#{boMPanelItem.materialType}" class="tdnowrap" >
			<f:facet name="header">
				<h:outputText value="#{i18n.col_tracebomassemblypanel_materialtype}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.materialType}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{boMPanelItem.traceBoMQuantity}" width="80" 
			rendered="#{controller.TBVisible}" >
			<f:facet name="header">
				<h:outputText value="#{i18n.col_tracebomassemblypanel_tbitem_quantity}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.traceBoMQuantity}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{boMPanelItem.revBomQuantity}" width="80" 
			rendered="#{controller.RBVisible}" >
			<f:facet name="header">
				<h:outputText value="#{i18n.col_tracebomassemblypanel_rbitem_quantity}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.revBomQuantity}" styleClass="pf-tooltip-target" />
		</p:column>

	</p:dataTable>
	<p/>
	<h:outputText styleClass="label-field-mandatory" value="#{i18n.result_total_number_records} #{controller.assemblyCheckDtos.size()}"/>



<!--Kontextmenü mit Möglichkeit, eine Zelle oder eine Zeile zu kopieren -->
	<h:inputHidden id="cellText" value="#{controller.cellText}" />
	<h:inputHidden id="rowCsv" value="#{controller.rowCsv}" />

	<p:contextMenu for="BoMTable" beforeShow="updateContextData(event, 'form:tabview2:#{copyVarPrefix}')" >
		<p:menuitem value="#{i18n.action_viewtbitem}" ajax="true" icon="pi pi-file" id="BoMTable_mniTBIView" 
			rendered="#{userSession.checkAuthorizationString('ADMINISTRATOR;READONLY') and controller.TBVisible}" action="#{controller.openViewTraceBoMItemDialog}">
			<f:setPropertyActionListener target="#{userSession.lastPage}" value="#{controller.currentPageURL}"/>
		</p:menuitem>

		<p:menuitem value="#{i18n.action_viewrbitem}" ajax="true" icon="pi pi-file" id="BoMTable_mniRBIView" 
			rendered="#{userSession.checkAuthorizationString('ADMINISTRATOR;READONLY') and controller.RBVisible}" action="#{controller.openViewRevisionBoMItemDialog}">
			<f:setPropertyActionListener target="#{userSession.lastPage}" value="#{controller.currentPageURL}"/>
		</p:menuitem>

		<p:menuitem value="#{i18n.action_viewmaterial}" ajax="true" icon="pi pi-file" id="BoMTable_viewmaterial" 
			rendered="#{userSession.checkAuthorizationString('ADMINISTRATOR;READONLY')}" action="#{controller.openViewMaterialDialog}">
			<f:setPropertyActionListener target="#{userSession.lastPage}" value="#{controller.currentPageURL}"/>
		</p:menuitem>

		<p:menuitem value="#{i18n.action_refresh}" ajax="false" type="push" icon="pi pi-refresh" id="BoMTable_mniRefresh" actionListener="#{controller.refresh}"/>

		<p:separator/>

		<p:menuitem value="#{i18n.ctxmenu_copy_cell}" actionListener="#{controller.copyCellToClipboard}" icon="pi pi-copy" update="@none"/>
		<p:menuitem value="#{i18n.ctxmenu_copy_row}" actionListener="#{controller.copyRowToClipboard}" icon="pi pi-copy" update="@none"/>
	</p:contextMenu>

</ui:composition>
