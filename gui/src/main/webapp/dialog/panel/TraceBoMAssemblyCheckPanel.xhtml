<ui:composition xmlns="https://jakarta.ee/xml/ns/jakartaee"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui">


	<p:menubar>
		<p:submenu icon="pi pi-refresh" label="#{i18n.mnu_view}">
			<p:menuitem value="#{i18n.action_refresh}" ajax="false" icon="pi pi-refresh" actionListener="#{traceBoMBoMAssemblyCheckPanel.refresh}"/>
		</p:submenu>
		<p:submenu icon="pi pi-print" label="#{i18n.mnu_export}">
			<p:menuitem value="#{i18n.action_export_xls}" ajax="false" icon="pi pi-file-excel">
				<p:dataExporter type="xlsxstream" target="TraceBoMTable" fileName="OnlyInTraceBoMList"/>
			</p:menuitem>
		</p:submenu>
	</p:menubar>


	<p:dataTable id="TraceBoMTable" var="boMPanelItem" 
		selectionMode="single" selectionTextDisabled="false"
		selection="#{traceBoMBoMAssemblyCheckPanel.selectedAssemblyCheckDto}"
		loadingMessage="#{i18n.action_fetch_data}"
		value="#{traceBoMBoMAssemblyCheckPanel.assemblyCheckDtos}"
        scrollable="true" styleClass="compareViewPanelScrollable" allowUnsorting="true" 
		rowKey="#{boMPanelItem.materialId}" resizableColumns="true" resizeMode="expand"
	>
		<p:ajax event="rowDblselect" listener="#{traceBoMBoMAssemblyCheckPanel.onBomItemsGridDoubleClick}"/>

		<p:column sortBy="#{boMPanelItem.materialNumber}" width="150" 
			exportValue="#{boMPanelItem.materialNumber}" class="tdnowrap" >
			<f:facet name="header">
				<h:outputText value="#{i18n.col_tracebomassemblypanel_materialnumber}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.materialNumber}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{boMPanelItem.traceBoMQuantity}" width="80" >
			<f:facet name="header">
				<h:outputText value="#{i18n.lbl_attr_tracebomitem_quantity}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.traceBoMQuantity}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{boMPanelItem.materialShortText}" width="250" 
			exportValue="#{boMPanelItem.materialShortText}" class="tdnowrap" >
			<f:facet name="header">
				<h:outputText value="#{i18n.lbl_attr_material_shorttext}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.materialShortText}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{boMPanelItem.materialHierarchy}" width="150" 
			exportValue="#{boMPanelItem.materialHierarchy}" class="tdnowrap" >
			<f:facet name="header">
				<h:outputText value="#{i18n.lbl_attr_material_materialhierarchy}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.materialHierarchy}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{boMPanelItem.materialType}" width="80" 
			exportValue="#{boMPanelItem.materialType}" class="tdnowrap" >
			<f:facet name="header">
				<h:outputText value="#{i18n.col_tracebomassemblypanel_materialtype}"/>
			</f:facet>
			<h:outputText value="#{boMPanelItem.materialType}" styleClass="pf-tooltip-target" />
		</p:column>

	</p:dataTable>
	<p/>
	<h:outputText styleClass="label-field-mandatory" value="#{i18n.result_total_number_records} #{traceBoMBoMAssemblyCheckPanel.assemblyCheckDtos.size()}"/>



<!--Kontextmenü mit Möglichkeit, eine Zelle oder eine Zeile zu kopieren -->
	<h:inputHidden id="bomcellText" value="#{traceBoMBoMAssemblyCheckPanel.cellText}" />
	<h:inputHidden id="bomrowCsv" value="#{traceBoMBoMAssemblyCheckPanel.rowCsv}" />

	<p:contextMenu for="TraceBoMTable" beforeShow="updateContextData(event, 'form:tabview2', 'bom')" >
		<p:menuitem value="#{i18n.action_view}" ajax="true" icon="pi pi-file" id="TraceBoMTable_mniView" 
		rendered="#{userSession.checkAuthorizationString('ADMINISTRATOR;READONLY;MATERIAL_MASTER')}" action="#{traceBoMBoMAssemblyCheckPanel.openViewTraceBoMItemDialog}">
			<f:setPropertyActionListener target="#{userSession.lastPage}" value="#{traceBoMBoMAssemblyCheckPanel.currentPageURL}"/>
		</p:menuitem>

		<p:menuitem value="#{i18n.action_materialRevisionBoMPanel_viewmaterial}" ajax="true" icon="pi pi-file" id="TraceBoMTable_viewmaterial" 
			rendered="#{userSession.checkAuthorizationString('ADMINISTRATOR;READONLY;MATERIAL_MASTER')}" action="#{traceBoMBoMAssemblyCheckPanel.openViewMaterialDialog}">
			<f:setPropertyActionListener target="#{userSession.lastPage}" value="#{traceBoMBoMAssemblyCheckPanel.currentPageURL}"/>
		</p:menuitem>

		<p:menuitem value="#{i18n.action_refresh}" ajax="false" type="push" icon="pi pi-refresh" id="TraceBoMTable_mniRefresh" actionListener="#{traceBoMBoMAssemblyCheckPanel.refresh}"/>

		<p:separator/>

		<p:menuitem value="#{i18n.ctxmenu_copy_cell}" actionListener="#{traceBoMBoMAssemblyCheckPanel.copyCellToClipboard}" icon="pi pi-copy" update="@none"/>
		<p:menuitem value="#{i18n.ctxmenu_copy_row}" actionListener="#{traceBoMBoMAssemblyCheckPanel.copyRowToClipboard}" icon="pi pi-copy" update="@none"/>
	</p:contextMenu>

</ui:composition>
