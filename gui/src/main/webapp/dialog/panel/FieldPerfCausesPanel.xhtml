<ui:composition xmlns="https://jakarta.ee/xml/ns/jakartaee"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="http://primefaces.org/ui">

	<p:dataTable id="panCauses" var="causeRow" rowIndexVar="rowIdx" 
		selectionTextDisabled="false" allowUnsorting="true" resizeMode="expand" resizableColumns="true" 
		selection="#{fieldPerfCausesPanel.selectedCause}" selectionMode="single" multiViewState="true" 
		loadingMessage="#{i18n.action_fetch_data}" 
		value="#{fieldPerfCausesPanel.causes}" scrollable="true" styleClass="viewScrollable fieldPerfReportSummaryScrollable" 
		rowKey="#{causeRow.cause()}" >

		<p:column sortBy="#{causeRow.cause()}" width="250" 
			exportValue="#{causeRow.cause()}" class="tdnowrap" >
			<f:facet name="header">
				<h:outputText value="#{i18n.col_fieldperfreportview_causes_causename}"/>
			</f:facet>
			<h:outputText value="#{causeRow.cause()}" styleClass="pf-tooltip-target" />
		</p:column>

		<p:column sortBy="#{causeRow.cnt()}" width="80" >
			<f:facet name="header">
				<h:outputText value="#{i18n.col_fieldperfreportview_causes_cnt}"/>
			</f:facet>
			<h:outputText value="#{causeRow.cnt()}" />
		</p:column>

	</p:dataTable>
	<p/>

	<h:outputText id="panCausesSummary" styleClass="label-field-mandatory" value="#{i18n.result_total_number_records} #{fieldPerfCausesPanel.causes.size()}"/>



<!--Kontextmenü mit Möglichkeit, eine Zelle oder eine Zeile zu kopieren -->
	<h:inputHidden id="causescellText" value="#{fieldPerfCausesPanel.cellText}" />
	<h:inputHidden id="causesrowCsv" value="#{fieldPerfCausesPanel.rowCsv}" />

	<p:contextMenu for="panCauses" beforeShow="updateContextData(event, 'form:tabview2', 'causes')" >
		<p:menuitem value="#{i18n.ctxmenu_copy_cell}" actionListener="#{fieldPerfCausesPanel.copyCellToClipboard}" icon="pi pi-copy" update="@none"/>
		<p:menuitem value="#{i18n.ctxmenu_copy_row}" actionListener="#{fieldPerfCausesPanel.copyRowToClipboard}" icon="pi pi-copy" update="@none"/>
	</p:contextMenu>

</ui:composition>
